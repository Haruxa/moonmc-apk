# Поиск экранного управления в собранном дереве (без компиляции).
name: inspect-touch

on:
  workflow_dispatch:
    inputs:
      pin:
        description: "Коммит Horizon"
        required: true
        default: "6f8c7a0e5d531d3834c4d0be4659a1db8e7e5c2a"

jobs:
  grep:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: "Дерево: пин + Android-порт"
        run: |
          git clone --quiet https://github.com/horizon-rust/horizon src
          cd src
          git config user.email ci@example.com && git config user.name ci
          git checkout -q -B build "${{ inputs.pin }}"
          git fetch --quiet https://git.narez.xyz/narezany/MargyMC \
            d4aaf6c53a9280ae8d8b0cedff0865661c6bb39f \
            7fbee7186d230003cffd44b34eee9be368a59188
          git cherry-pick -n -X ours d4aaf6c53a9280ae8d8b0cedff0865661c6bb39f 7fbee7186d230003cffd44b34eee9be368a59188 > /dev/null 2>&1 || true

      - name: "Где живёт экранное управление"
        run: |
          cd src
          echo "== crates/horizon-android:"
          find crates/horizon-android -maxdepth 2 | head -20
          echo
          echo "== файлы с 'touch' (по числу вхождений):"
          grep -rIc --include=*.rs -i "touch" crates 2>/dev/null | grep -v ':0$' | sort -t: -k2 -rn | head -20
          echo
          echo "== признаки экранных кнопок:"
          for pat in on_screen_controls virtual_button virtual_stick joystick touch_button touch_ui overlay_button hud_button; do
            n=$(grep -rIl --include=*.rs -i "$pat" crates 2>/dev/null | wc -l)
            echo "  $pat: файлов $n"
          done
          echo
          echo "== android.rs: как приходят события ввода:"
          grep -nE "fn |touch|pointer|MotionEvent|input" crates/horizon-client/src/android.rs | head -40
          echo
          echo "== куда маршрутизируется ввод:"
          grep -rn --include=*.rs -E "android_main|WindowEvent|fn handle_.*input|CursorMoved|Touch" crates/horizon-client/src/android.rs crates/horizon-client/src/game.rs 2>/dev/null | head -25
