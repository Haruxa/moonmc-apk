# Ворота №2: перенос Android-порта MargyMC на коммит-пин модов.
# Только git: клонируем upstream, встаём на пин, черри-пикаем порт.
name: pin-port

on:
  workflow_dispatch:
    inputs:
      pins:
        description: "Пины через пробел"
        required: true
        default: "6f8c7a0e5d531d3834c4d0be4659a1db8e7e5c2a 142388e1c136e622652ec7505af15d8ad195e041"

jobs:
  port:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Клон upstream (полная история)
        run: |
          git clone --quiet https://github.com/horizon-rust/horizon src
          cd src
          git config user.email ci@example.com
          git config user.name ci
          git fetch --quiet https://git.narez.xyz/narezany/MargyMC \
            d4aaf6c53a9280ae8d8b0cedff0865661c6bb39f \
            7fbee7186d230003cffd44b34eee9be368a59188
          echo "порт и патч 0.1.1 подтянуты"

      - name: Cherry-pick порта на каждый пин
        run: |
          cd src
          for pin in ${{ inputs.pins }}; do
            echo "================= пин $pin"
            git checkout -q -B "try-$pin" "$pin"
            echo "  база: $(git log -1 --format='%h %ad %s' --date=short | cut -c1-70)"
            for c in d4aaf6c53a9280ae8d8b0cedff0865661c6bb39f 7fbee7186d230003cffd44b34eee9be368a59188; do
              if git cherry-pick -x "$c" > /tmp/cp.log 2>&1; then
                echo "  ${c:0:8}: чисто"
              else
                echo "  ${c:0:8}: КОНФЛИКТ — файлы:"
                git diff --name-only --diff-filter=U | sed 's/^/      /'
                git cherry-pick --abort > /dev/null 2>&1
                break
              fi
            done
            git checkout -q main 2>/dev/null || git checkout -q "$(git symbolic-ref refs/remotes/origin/HEAD | sed 's|refs/remotes/origin/||')"
          done
