# MoonMC: сборка APK игры через Gradle (Kotlin + Compose) — путь для игрового
# Compose-слоя (управление и настройки в духе Zalith Launcher 2).
# Нативная часть (Rust) и ассеты готовятся теми же скриптами, что и в apk.yml.
name: apk-gradle

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Профиль cargo"
        type: choice
        options: [fast, release]
        default: fast
      native_pin:
        description: "Пин движка"
        required: true
        default: "a46ce6898bd72016e061aaec1afc1375b384deac"
      mixins_rev:
        description: "Ревизия horizon-mixins"
        required: false
        default: "3f99a5c60dfa311cc365524c44ae2fd799bfa1de"
      native_mods:
        description: "Бандлы .hnmod через запятую (none = без модов)"
        required: false
        default: "fps_overlay"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Окружение
        run: |
          echo "NDK=${ANDROID_NDK_LATEST_HOME:-}"; java -version 2>&1 | head -2
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/az || true
          df -h /

      - name: "Дерево: пин движка + снимок Android-порта"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone -q https://github.com/horizon-rust/horizon src
          cd src
          git fetch -q --depth 1 origin "${{ inputs.native_pin }}"
          git checkout -q FETCH_HEAD
          echo "${{ inputs.native_pin }}" > .horizon-revision
          gh api "repos/${{ github.repository }}/contents/ci/port/port.tgz?ref=${{ github.sha }}" \
            -H "Accept: application/vnd.github.raw" > /tmp/port.tgz
          tar xzf /tmp/port.tgz -C .
          echo "== дерево: $(git rev-parse --short HEAD), порт: $(git status --porcelain | wc -l) файлов"

      - name: Rust
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          . "$HOME/.cargo/env"; rustc -V
          rustup target add aarch64-linux-android

      # exporters и ассеты берём тем же способом, что и apk.yml
      - name: Забрать exporters
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          mkdir -p "$RUNNER_TEMP"
          id=$(gh api "repos/$REPO/actions/artifacts?name=exporters&per_page=50" \
                 --jq '[.artifacts[] | select(.expired == false)][0].id // ""' || true)
          test -n "$id" || { echo "::error::нет артефакта exporters"; exit 1; }
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            -o /tmp/exporters.zip "https://api.github.com/repos/$REPO/actions/artifacts/$id/zip"
          rm -rf /tmp/exporters && unzip -oq /tmp/exporters.zip -d /tmp/exporters
          find /tmp/exporters -name exporters.tgz -exec cp {} "$RUNNER_TEMP/exporters.tgz" \;
          ls -lh "$RUNNER_TEMP/exporters.tgz"

      - name: "Патчи и сборка дерева (нативка, java, res, ассеты)"
        working-directory: src
        env:
          PROFILE: ${{ inputs.profile }}
          MODS: 1
          CI_KEYSTORE_B64: ${{ secrets.CI_KEYSTORE_B64 }}
          CI_KEYSTORE_PASS: ${{ secrets.CI_KEYSTORE_PASS }}
        run: |
          cp -a "$GITHUB_WORKSPACE/ci" ci
          mkdir -p .local && tar xzf "$RUNNER_TEMP/exporters.tgz" -C .local
          python3 ci/patch-game-home.py
          python3 ci/patch-branding.py
          python3 ci/patch-package.py
          python3 ci/patch-touch.py ci/touch_layout.rs ci/touch_menu.rs || true
          set +e
          bash ci/build-apk-modded.sh > /tmp/build.log 2>&1
          status=$?
          tail -15 /tmp/build.log
          if [ $status -ne 0 ]; then
            echo "== ошибки сборки:"
            grep -n "error" /tmp/build.log | head -30
            echo "== хвост сборки:"
            tail -40 /tmp/build.log
            exit $status
          fi
          ls -l android/out/stage/lib/arm64-v8a/ android/out/assets | head -20

      - name: Разложить в Gradle-проект
        run: |
          mkdir -p game/app/src/main/jniLibs/arm64-v8a
          cp src/android/out/stage/lib/arm64-v8a/libhorizon.so game/app/src/main/jniLibs/arm64-v8a/
          rm -rf game/app/src/main/res game/app/src/main/assets game/app/src/main/java
          mkdir -p game/app/src/main/res game/app/src/main/assets game/app/src/main/java
          cp -a src/android/res/. game/app/src/main/res/
          cp -a src/android/out/assets/. game/app/src/main/assets/
          # наша раскладка Zalith лежит вне assets, чтобы не затиралась ассетами движка
          cp game/app/src/main/layout/default_layout.json game/app/src/main/assets/
          cp -a src/android/java/. game/app/src/main/java/
          # AGP 9 не принимает <uses-sdk> и package= в манифесте: SDK — в build.gradle,
          # namespace — тоже; вычищаем их при копировании.
          sed -e '/<uses-sdk/d' -e 's/ *package="[^"]*"//' \
              -e 's/ *android:extractNativeLibs="[^"]*"//' \
            src/android/AndroidManifest.xml > game/app/src/main/AndroidManifest.xml
          head -6 game/app/src/main/AndroidManifest.xml
          echo "java: $(find game/app/src/main/java -name '*.java' | wc -l), assets: $(du -sh game/app/src/main/assets | cut -f1)"

      - name: Подпись + сборка APK
        env:
          MOON_KEYSTORE: ${{ github.workspace }}/game/ci.jks
          MOON_KEYSTORE_PASS: ${{ secrets.CI_KEYSTORE_PASS }}
          CI_KEYSTORE_B64: ${{ secrets.CI_KEYSTORE_B64 }}
        run: |
          if [ -n "$CI_KEYSTORE_B64" ]; then
            printf '%s' "$CI_KEYSTORE_B64" | base64 -d > "$MOON_KEYSTORE"
          else
            keytool -genkeypair -keystore "$MOON_KEYSTORE" -alias horizon -keyalg RSA \
              -keysize 2048 -validity 10000 -storepass "$MOON_KEYSTORE_PASS" \
              -dname "CN=horizon" >/dev/null 2>&1
          fi
          cd game
          gradle --no-daemon :app:assembleRelease

      - name: Артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-apk-gradle
          path: game/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
