# Пробный прогон нативных модов (.hnmod): накладываются ли хуки horizon-mixins
# на наш форк MargyMC (Android-порт). Ничего не собирает — только apply и diff.
name: native-check

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "База архива исходников MargyMC"
        required: true
        default: "https://git.narez.xyz/narezany/MargyMC"
      source_ref:
        description: "Ветка/тег/коммит"
        required: true
        default: "main"
      mixins_rev:
        description: "Коммит horizon-mixins"
        required: true
        default: "0d6b103c70633d8fd9443d8d0acd3aadaacedb06"

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Исходники MargyMC
        run: git clone --depth 1 --branch "${{ inputs.source_ref }}" "${{ inputs.source_url }}" src

      - uses: dtolnay/rust-toolchain@stable

      - name: Сборка horizon-mixins
        run: cargo install --locked --git https://github.com/horizon-rust/horizon-mixins --rev "${{ inputs.mixins_rev }}"

      - name: Убрать симлинки (horizon-mixins их не принимает)
        run: |
          echo "== симлинки в дереве:"
          find src -type l -printf '%p -> %l\n' | head -20
          find src -type l -delete
          echo "осталось симлинков: $(find src -type l | wc -l)"

      - name: Распаковка бандла
        run: |
          mkdir -p mods.incoming tmp
          unzip -o ci/bundles/fps_overlay.hnmod -d tmp
          cp -r tmp/mixins/fps_overlay mods.incoming/fps_overlay
          echo "== бандл:"; find mods.incoming -type f | sort

      - name: horizon-mixins apply
        run: |
          horizon-mixins apply --workspace src --mods mods.incoming --out stage
          echo "== изменённые файлы:"; (cd stage && find . -type f | sort)

      - name: Что именно вставилось в game.rs
        run: |
          diff -u src/crates/horizon-client/src/game.rs stage/crates/horizon-client/src/game.rs | head -120 || true

      - name: Сводка
        run: |
          echo "apply прошёл; файлов в stage: $(find stage -type f | wc -l)"
          du -sh stage
