# Этап 2: полный APK с фичей `mods`.
# Нужен архив с папкой Minecraft 26.3 в Release этого же приватного репозитория:
#   versions/26.3/26.3.jar, libraries/, assets/ и server.jar
# Репозиторий приватный, Release приватный, артефакт доступен только тебе.
#
# Две job-ы: prepare (мало места, кэш отдельный) → apk (полная сборка).
name: apk

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "База архива исходников MargyMC"
        required: true
        default: "https://git.narez.xyz/narezany/MargyMC"
      source_ref:
        description: "Ветка/тег/коммит MargyMC"
        required: true
        default: "main"
      profile:
        description: "Профиль cargo"
        type: choice
        options: [fast, release]
        default: fast
      mods:
        description: "Собирать с код-модами (--features mods)"
        type: boolean
        default: true
      mc_asset:
        description: "Имя zip-ассета с Minecraft в Release (пусто = первый *.zip)"
        required: false
        default: ""

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Окружение раннера
        run: |
          echo "cpu=$(nproc)"; free -h; df -h /
          echo "NDK=${ANDROID_NDK_LATEST_HOME:-}"; java -version 2>&1 | head -3

      - name: Освободить место на диске
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/az \
                      "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Скачать исходники MargyMC
        run: |
          mkdir -p src && cd src
          curl -fsSL --retry 3 -o s.tgz "${{ inputs.source_url }}/archive/${{ inputs.source_ref }}.tar.gz"
          tar xzf s.tgz --strip-components=1 && rm -f s.tgz
          ls research-lock.json

      - name: Rust
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          . "$HOME/.cargo/env"; rustc -vV

      - name: Кэш registry + target(prepare)
        uses: actions/cache@v4
        with:
          path: |
            src/target
            ~/.cargo/registry
            ~/.cargo/git
          key: prepare-${{ inputs.source_ref }}-${{ hashFiles('src/Cargo.lock') }}
          restore-keys: check-${{ inputs.source_ref }}-

      - name: JDK 25 (для horizon-prepare)
        run: |
          curl -fsSL -o /tmp/jdk25.tgz "https://api.adoptium.net/v3/binary/latest/25/ga/linux/x64/jdk/hotspot/normal/eclipse"
          mkdir -p "$RUNNER_TEMP/jdk25" && tar xzf /tmp/jdk25.tgz -C "$RUNNER_TEMP/jdk25" --strip-components=1
          "$RUNNER_TEMP/jdk25/bin/java" -version 2>&1 | head -2
          echo "JDK25=$RUNNER_TEMP/jdk25" >> "$GITHUB_ENV"

      - name: Файлы Minecraft из Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/raw "$RUNNER_TEMP/mc"
          if [ -n "${{ inputs.mc_asset }}" ]; then
            gh release download --pattern "${{ inputs.mc_asset }}" --dir /tmp/raw --clobber
          else
            gh release download --pattern '*.zip' --dir /tmp/raw --clobber
          fi
          ls -l /tmp/raw
          for z in /tmp/raw/*.zip; do unzip -oq "$z" -d "$RUNNER_TEMP/mc"; done
          rm -rf /tmp/raw
          [ -d "$RUNNER_TEMP/mc/.minecraft" ] && mv "$RUNNER_TEMP/mc/.minecraft" "$RUNNER_TEMP/mc/mc"
          MC="$RUNNER_TEMP/mc"
          [ -d "$MC/minecraft" ] && MC="$MC/minecraft"
          echo "MC=$MC" >> "$GITHUB_ENV"
          echo "== содержимое:"; ls "$MC"; du -sh "$MC"/* | head
          test -f "$MC/versions/26.3/26.3.jar" || { echo "::error::нет $MC/versions/26.3/26.3.jar"; exit 1; }
          df -h /

      - name: horizon-prepare --prepare
        working-directory: src
        run: |
          set -o pipefail
          . "$HOME/.cargo/env"
          cargo build --locked --release -p horizon-prepare 2>&1 | tail -3
          SRV=$(find "$MC" -maxdepth 3 -name 'server*.jar' | head -1 || true)
          echo "mc=$MC  server=${SRV:-<нет>}"
          ARGS=(--prepare --minecraft-dir "$MC" --root "$GITHUB_WORKSPACE")
          [ -n "$SRV" ] && ARGS+=(--server-jar "$SRV")
          JAVA_HOME="$JDK25" PATH="$JDK25/bin:$PATH" \
            target/release/horizon-prepare "${ARGS[@]}" 2>&1 | tail -80
          echo "== exporters:"; find .local/exporters -maxdepth 2 | head -20
          df -h /

      - name: Упаковать exporters
        working-directory: src
        run: |
          tar czf "$RUNNER_TEMP/exporters.tgz" -C .local exporters
          ls -lh "$RUNNER_TEMP/exporters.tgz"

      - name: Артефакт exporters
        uses: actions/upload-artifact@v4
        with:
          name: exporters
          path: ${{ runner.temp }}/exporters.tgz
          if-no-files-found: error

  apk:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Окружение раннера
        run: |
          echo "cpu=$(nproc)"; free -h; df -h /
          echo "NDK_LATEST=${ANDROID_NDK_LATEST_HOME:-}"; echo "SDK=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" 2>/dev/null || true
          java -version 2>&1 | head -3

      - name: Освободить место на диске
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/az \
                      "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Скачать исходники MargyMC
        run: |
          mkdir -p src && cd src
          curl -fsSL --retry 3 -o s.tgz "${{ inputs.source_url }}/archive/${{ inputs.source_ref }}.tar.gz"
          tar xzf s.tgz --strip-components=1 && rm -f s.tgz

      - name: Rust + цель aarch64-linux-android
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          . "$HOME/.cargo/env"; rustc -vV
          rustup target add aarch64-linux-android

      - name: Кэш target + registry
        uses: actions/cache@v4
        with:
          path: |
            src/target
            ~/.cargo/registry
            ~/.cargo/git
          key: apk-${{ inputs.profile }}-${{ inputs.mods }}-${{ inputs.source_ref }}-${{ hashFiles('src/Cargo.lock') }}
          restore-keys: |
            modcheck-${{ inputs.source_ref }}-

      - name: Забрать exporters из job prepare
        uses: actions/download-artifact@v4
        with:
          name: exporters
          path: ${{ runner.temp }}

      - name: Распаковать exporters
        working-directory: src
        run: |
          mkdir -p .local
          tar xzf "$RUNNER_TEMP/exporters.tgz" -C .local
          find .local -maxdepth 2 | head -20

      - name: Сборка APK
        working-directory: src
        env:
          PROFILE: ${{ inputs.profile }}
          MODS: ${{ inputs.mods && '1' || '0' }}
        run: |
          . "$HOME/.cargo/env"
          bash ci/build-apk-modded.sh 2>&1 | tail -150
          df -h /

      - name: Артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-apk
          path: src/ci-out/
          if-no-files-found: warn
