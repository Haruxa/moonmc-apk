# Этап 2: полный APK с фичей `mods`.
# Нужен архив с папкой Minecraft 26.3 в Release этого же приватного репозитория:
#   versions/26.3/26.3.jar, libraries/, assets/ и server.jar
# Репозиторий приватный, Release приватный, артефакт доступен только тебе.
#
# Две job-ы: prepare (экспортёры из Minecraft, кэшируются) → apk (сборка с --features mods).
name: apk

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "База архива исходников MargyMC"
        required: true
        default: "https://git.narez.xyz/narezany/MargyMC"
      source_ref:
        description: "Ветка/тег/коммит MargyMC"
        required: true
        default: "main"
      profile:
        description: "Профиль cargo"
        type: choice
        options: [fast, release]
        default: fast
      mods:
        description: "Собирать с код-модами (--features mods)"
        type: boolean
        default: true
      mc_asset:
        description: "Имя zip-ассета с Minecraft в Release (пусто = первый *.zip)"
        required: false
        default: ""
      home_on_sdcard:
        description: "Папка игры в /sdcard/MoonMC/horizon (моды и миры видны файловому менеджеру)"
        type: boolean
        default: true
      native_pin:
        description: "Пин horizon-rust/horizon для нативных модов (пусто = обычная сборка MargyMC)"
        required: false
        default: ""
      mixins_rev:
        description: "Ревизия horizon-rust/horizon-mixins"
        required: false
        default: "0d6b103c70633d8fd9443d8d0acd3aadaacedb06"
      mod_urls:
        description: "Ссылки на .hnmod через пробел (только при native_pin)"
        required: false
        default: ""
      native_mods:
        description: "Какие бандлы ci/bundles/*.hnmod вшить (через запятую; пусто = все)"
        required: false
        default: ""

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Окружение раннера
        run: |
          echo "cpu=$(nproc)"; free -h; df -h /
          echo "NDK=${ANDROID_NDK_LATEST_HOME:-}"; java -version 2>&1 | head -3

      - name: Освободить место на диске
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/az \
                      "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Скачать исходники MargyMC
        run: |
          mkdir -p src && cd src
          curl -fsSL --retry 3 -o s.tgz "${{ inputs.source_url }}/archive/${{ inputs.source_ref }}.tar.gz"
          tar xzf s.tgz --strip-components=1 && rm -f s.tgz

          ls research-lock.json

      - name: Rust
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          . "$HOME/.cargo/env"; rustc -vV

      - name: Кэш registry + target(prepare)
        uses: actions/cache@v4
        with:
          path: |
            src/target
            ~/.cargo/registry
            ~/.cargo/git
          key: prepare-${{ inputs.source_ref }}-${{ hashFiles('src/Cargo.lock') }}
          restore-keys: check-${{ inputs.source_ref }}-

      - name: Кэш exporters (пропускает импорт Minecraft при повторе)
        id: ex
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/exporters.tgz
          key: exporters-${{ inputs.source_ref }}-${{ hashFiles('src/Cargo.lock') }}

      - name: JDK 25 (для horizon-prepare)
        if: steps.ex.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/jdk25.tgz "https://api.adoptium.net/v3/binary/latest/25/ga/linux/x64/jdk/hotspot/normal/eclipse"
          mkdir -p "$RUNNER_TEMP/jdk25" && tar xzf /tmp/jdk25.tgz -C "$RUNNER_TEMP/jdk25" --strip-components=1
          "$RUNNER_TEMP/jdk25/bin/java" -version 2>&1 | head -2
          echo "JDK25=$RUNNER_TEMP/jdk25" >> "$GITHUB_ENV"

      - name: Файлы Minecraft из Release
        if: steps.ex.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          mkdir -p /tmp/raw "$RUNNER_TEMP/mc"
          if [ -n "${{ inputs.mc_asset }}" ]; then
            gh release download --repo "$REPO" --pattern "${{ inputs.mc_asset }}" --dir /tmp/raw --clobber
          else
            gh release download --repo "$REPO" --pattern '*.zip' --dir /tmp/raw --clobber
          fi
          ls -l /tmp/raw
          for z in /tmp/raw/*.zip; do unzip -oq "$z" -d "$RUNNER_TEMP/mc"; done
          rm -rf /tmp/raw
          MC="$RUNNER_TEMP/mc"
          if [ -d "$MC/.minecraft" ]; then MC="$MC/.minecraft"; fi
          if [ -d "$MC/minecraft" ]; then MC="$MC/minecraft"; fi
          echo "MC=$MC" >> "$GITHUB_ENV"
          echo "== содержимое $MC:"; ls "$MC"; du -sh "$MC"/* | head
          test -f "$MC/versions/26.3/26.3.jar" || { echo "::error::нет $MC/versions/26.3/26.3.jar"; exit 1; }
          df -h /

      - name: horizon-prepare --prepare
        if: steps.ex.outputs.cache-hit != 'true'
        working-directory: src
        run: |
          set -o pipefail
          . "$HOME/.cargo/env"
          cargo build --locked --release -p horizon-prepare 2>&1 | tail -3
          SRV=$(find "$MC" -maxdepth 3 -name 'server*.jar' | head -1 || true)
          echo "mc=$MC  server=${SRV:-<нет>}"
          ARGS=(--prepare --minecraft-dir "$MC" --root "$GITHUB_WORKSPACE/src")
          if [ -n "$SRV" ]; then ARGS+=(--server-jar "$SRV"); fi
          JAVA_HOME="$JDK25" PATH="$JDK25/bin:$PATH" \
            target/release/horizon-prepare "${ARGS[@]}" 2>&1 | tail -80
          echo "== exporters:"; find .local/exporters -maxdepth 2 | head -20
          df -h /

      - name: Упаковать exporters
        if: steps.ex.outputs.cache-hit != 'true'
        working-directory: src
        run: |
          tar czf "$RUNNER_TEMP/exporters.tgz" -C .local exporters
          ls -lh "$RUNNER_TEMP/exporters.tgz"

      - name: Артефакт exporters
        uses: actions/upload-artifact@v4
        with:
          name: exporters
          path: ${{ runner.temp }}/exporters.tgz
          if-no-files-found: error

  apk:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Окружение раннера
        run: |
          echo "cpu=$(nproc)"; free -h; df -h /
          echo "NDK_LATEST=${ANDROID_NDK_LATEST_HOME:-}"; echo "SDK=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" 2>/dev/null || true
          java -version 2>&1 | head -3

      - name: Освободить место на диске
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/az \
                      "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Скачать исходники MargyMC
        if: inputs.native_pin == ''
        run: |
          mkdir -p src && cd src
          curl -fsSL --retry 3 -o s.tgz "${{ inputs.source_url }}/archive/${{ inputs.source_ref }}.tar.gz"
          tar xzf s.tgz --strip-components=1 && rm -f s.tgz

      - name: "Дерево: пин игры + Android-порт MargyMC"
        if: inputs.native_pin != ''
        run: |
          git clone --quiet https://github.com/horizon-rust/horizon src
          cd src
          git config user.email ci@example.com && git config user.name ci
          git checkout -q -B build "${{ inputs.native_pin }}"
          git fetch --quiet https://git.narez.xyz/narezany/MargyMC \
            d4aaf6c53a9280ae8d8b0cedff0865661c6bb39f \
            7fbee7186d230003cffd44b34eee9be368a59188
          git cherry-pick -n -X ours d4aaf6c53a9280ae8d8b0cedff0865661c6bb39f 7fbee7186d230003cffd44b34eee9be368a59188
          echo "${{ inputs.native_pin }}" > .horizon-revision
          echo "== дерево: HEAD=$(git rev-parse --short HEAD) файлов=$(git status --porcelain | wc -l)"

      - name: Скрипты и патчи из нашего репозитория
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p src/ci
          fetch() {
            mkdir -p "src/ci/$(dirname "$1")"
            gh api "repos/${{ github.repository }}/contents/ci/$1?ref=${{ github.sha }}" \
              -H "Accept: application/vnd.github.raw" > "src/ci/$1"
            printf '   %s: %s строк\n' "$1" "$(wc -l < "src/ci/$1")"
          }
          fetch build-apk-modded.sh
          fetch patch-game-home.py
          fetch patch-touch.py
          fetch patch-branding.py
          fetch patch-package.py
          fetch touch_layout.rs
          # все бандлы .hnmod: какие собирать, выбирает лаунчер (input native_mods)
          mkdir -p src/ci/bundles
          gh api "repos/${{ github.repository }}/git/trees/${{ github.sha }}?recursive=1" \
            --jq '.tree[] | select(.type=="blob") | select(.path|startswith("ci/bundles/")) | select(.path|endswith(".hnmod")) | .path' \
            | while read -r p; do
            mkdir -p "src/$(dirname "$p")"
            gh api "repos/${{ github.repository }}/contents/$p?ref=${{ github.sha }}" \
              -H "Accept: application/vnd.github.raw" > "src/$p"
          done
          echo "   бандлы: $(find src/ci/bundles -name '*.hnmod' | wc -l) файлов: $(ls src/ci/bundles | tr '\n' ' ')"
          # экран первой загрузки MoonMC (java рисуется кодом)
          mkdir -p src/ci/splash
          gh api "repos/${{ github.repository }}/git/trees/${{ github.sha }}?recursive=1" \
            --jq '.tree[] | select(.type=="blob") | select(.path|startswith("ci/splash/")) | .path' \
            | while read -r p; do
            mkdir -p "src/$(dirname "$p")"
            gh api "repos/${{ github.repository }}/contents/$p?ref=${{ github.sha }}" \
              -H "Accept: application/vnd.github.raw" > "src/$p"
          done
          echo "   экран загрузки: $(find src/ci/splash -name '*.java' | wc -l) файлов"
          # иконки и adaptive-xml для брендинга MoonMC: обходим дерево рекурсивно
          # (contents API по каталогу отдаёт JSON-листинг, а не файл)
          mkdir -p src/ci/branding
          gh api "repos/${{ github.repository }}/git/trees/${{ github.sha }}?recursive=1" \
            --jq '.tree[] | select(.type=="blob") | select(.path|startswith("ci/branding/")) | .path' \
            | while read -r p; do
            mkdir -p "src/$(dirname "$p")"
            gh api "repos/${{ github.repository }}/contents/$p?ref=${{ github.sha }}" \
              -H "Accept: application/vnd.github.raw" > "src/$p"
          done
          echo "   branding: $(find src/ci/branding -type f | wc -l) файлов, png: $(find src/ci/branding -name '*.png' | wc -l)"

      - name: "Патч: папка игры на /sdcard"
        if: inputs.home_on_sdcard
        working-directory: src
        run: python3 ci/patch-game-home.py

      - name: "Патч: имя и иконка MoonMC (Material You)"
        working-directory: src
        run: python3 ci/patch-branding.py

      - name: "Патч: пакет приложения dev.moonmc.moonmc"
        working-directory: src
        run: python3 ci/patch-package.py

      - name: Rust + цель aarch64-linux-android
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          . "$HOME/.cargo/env"; rustc -vV
          rustup target add aarch64-linux-android

      - name: Кэш target + registry
        uses: actions/cache@v4
        with:
          path: |
            src/target
            ~/.cargo/registry
            ~/.cargo/git
          key: apk-${{ inputs.profile }}-${{ inputs.mods }}-${{ inputs.source_ref }}-${{ hashFiles('src/Cargo.lock') }}
          restore-keys: |
            modcheck-${{ inputs.source_ref }}-

      - name: Забрать exporters из job prepare
        uses: actions/download-artifact@v4
        with:
          name: exporters
          path: ${{ runner.temp }}

      - name: Распаковать exporters
        working-directory: src
        run: |
          mkdir -p .local
          tar xzf "$RUNNER_TEMP/exporters.tgz" -C .local
          find .local -maxdepth 2 | head -20

      - name: Собрать горизонт-миксины
        if: inputs.native_pin != ''
        run: |
          git clone --quiet https://github.com/horizon-rust/horizon-mixins mixins
          cd mixins
          git checkout -q "${{ inputs.mixins_rev }}"
          cargo build --quiet --release
          ls -l target/release/ | grep -i mixins

      - name: Скачать нативные моды
        if: inputs.native_pin != '' && inputs.native_mods != 'none'
        run: |
          mkdir -p mods.incoming
          i=0
          # Без ссылок берём бандлы из своего дерева (ci/bundles/*.hnmod) — приватный
          # репозиторий нельзя скачать обычным curl.
          if [ -z "${{ inputs.mod_urls }}" ]; then
            wanted="$(printf '%s' "${{ inputs.native_mods }}" | tr ',' ' ')"
            if [ "$wanted" = "none" ]; then
              echo "  нативные бандлы не выбраны — собираю без модов"
              exit 0
            fi
            for f in src/ci/bundles/*.hnmod; do
              [ -e "$f" ] || continue
              # выбор лаунчера: имя бандла без расширения в списке (пусто = все)
              name=$(basename "$f" .hnmod)
              if [ -n "$wanted" ]; then
                case " $wanted " in
                  *" $name "*) ;;
                  *) echo "  пропускаю $name (не выбран)"; continue ;;
                esac
              fi
              i=$((i+1))
              mkdir -p "mods.incoming/mod$i"
              unzip -o -q "$f" -d "mods.incoming/mod$i"
              echo "  мод $i (бандл): $f, $(find "mods.incoming/mod$i" -name 'horizon-mixin.toml' | wc -l) манифест(ов)"
            done
          fi
          for u in ${{ inputs.mod_urls }}; do
            i=$((i+1))
            curl -fsSL --retry 3 -o "/tmp/mod$i.hnmod" "$u"
            mkdir -p "mods.incoming/mod$i"
            unzip -o -q "/tmp/mod$i.hnmod" -d "mods.incoming/mod$i"
            echo "  мод $i: $(find "mods.incoming/mod$i" -name 'horizon-mixin.toml' | wc -l) манифест(ов)"
          done
          # horizon-mixins не рекурсирует по каталогам: раскладываем все моды в одну папку
          mkdir -p mods.incoming/mixins
          for d in mods.incoming/mod*/; do
            if [ -d "$d/mixins" ]; then cp -a "$d/mixins/." mods.incoming/mixins/; else cp -a "$d." mods.incoming/mixins/; fi
          done
          echo "  манифестов после раскладки: $(find mods.incoming/mixins -name 'horizon-mixin.toml' | wc -l)"
          test "$i" -gt 0

      - name: Вшить моды в дерево
        if: inputs.native_pin != '' && inputs.native_mods != 'none'
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          ANDROID=crates/horizon-client/src/android.rs
          # horizon-mixins отвергает симлинки (CLAUDE.md -> AGENTS.md)
          find src -type l -not -path 'src/.git/*' -not -path 'src/target/*' -delete || true
          # и требует, чтобы у game.rs был единственный владелец: на время apply
          # horizon-android подменяем заглушкой, настоящий файл вернём после
          cp "src/$ANDROID" /tmp/android.rs.bak
          printf 'fn stub() {}\n' > "src/$ANDROID"
          # horizon-mixins генерирует EventLoop::new()?.run_app(...), а в этом пине
          # game.rs не импортирует тип EventLoop (есть только ActiveEventLoop)
          GAME=crates/horizon-client/src/game.rs
          ln=$(grep -n '^use ' "src/$GAME" | head -1 | cut -d: -f1)
          # вставляем ПЕРЕД первым top-level use: он может быть многострочным
          sed -i "${ln}i use winit::event_loop::EventLoop;" "src/$GAME"
          sed -n "$((ln - 1)),$((ln + 1))p" "src/$GAME"
          ./mixins/target/release/horizon-mixins apply \
            --workspace src --mods mods.incoming/mixins --out src-out
          cp /tmp/android.rs.bak "src-out/$ANDROID"
          # ВАЖНО: horizon-mixins генерирует EventLoop::new(), а на Android так нельзя
          # (panic "An AndroidApp as passed to android_main() is required...").
          # Движок в том же файле использует horizon_client::event_loop::new() — берём его.
          sed -i -e 's/winit::event_loop::EventLoop::new()/horizon_client::event_loop::new()/g' \
                 -e 's/EventLoop::new()/horizon_client::event_loop::new()/g' "src-out/$GAME"
          grep -n 'event_loop::new()' "src-out/$GAME" | head -3
          LEFT=$(grep -c 'EventLoop::new()' "src-out/$GAME" || true)
          FIXED=$(grep -c 'horizon_client::event_loop::new()' "src-out/$GAME" || true)
          echo "== EventLoop::new() осталось: $LEFT, через хелпер: $FIXED"
          test "$LEFT" = "0"
          # Профили экранного управления: раскладка кнопок из JSON (touch/profiles/*.json).
          ( cd src-out && python3 ../src/ci/patch-touch.py ../src/ci/touch_layout.rs )
          grep -n 'mod touch_layout' "src-out/$GAME" | head -2
          cp -a src/.local src-out/.local
          echo "== вшитые файлы: $(ls src-out/crates/horizon-client/src/game/ | grep -c official || true)"
          rm -rf src && mv src-out src

      - name: Сборка APK
        working-directory: src
        env:
          PROFILE: ${{ inputs.profile }}
          MODS: ${{ inputs.mods && '1' || '0' }}
          CI_KEYSTORE_B64: ${{ secrets.CI_KEYSTORE_B64 }}
          CI_KEYSTORE_PASS: ${{ secrets.CI_KEYSTORE_PASS }}
        run: |
          . "$HOME/.cargo/env"
          bash ci/build-apk-modded.sh 2>&1 | tail -150
          df -h /

      - name: Артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-apk
          path: src/ci-out/
          if-no-files-found: warn
